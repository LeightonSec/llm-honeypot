<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria · NexusAI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f5f5f7;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e5ea;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .logo {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 600;
      color: #111;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 11px;
      color: #8e8e93;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #48484a;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #34c759;
      border-radius: 50%;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 2px; }

    .welcome {
      margin: auto;
      text-align: center;
      padding: 32px 16px;
      max-width: 480px;
    }

    .welcome-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      margin: 0 auto 16px;
    }

    .welcome h2 {
      font-size: 22px;
      font-weight: 600;
      color: #1c1c1e;
      margin-bottom: 6px;
    }

    .welcome p {
      font-size: 14px;
      color: #636366;
      line-height: 1.5;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    .suggestion {
      padding: 7px 14px;
      background: #fff;
      border: 1px solid #e5e5ea;
      border-radius: 20px;
      font-size: 13px;
      color: #3a3a3c;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .suggestion:hover {
      background: #6366f1;
      color: #fff;
      border-color: #6366f1;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
    }

    .msg-row.user { align-items: flex-end; }
    .msg-row.assistant { align-items: flex-start; }

    .bubble {
      max-width: min(72%, 600px);
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
    }

    .msg-row.user .bubble {
      background: #6366f1;
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .msg-row.assistant .bubble {
      background: #fff;
      color: #1c1c1e;
      border-bottom-left-radius: 5px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    .typing-bubble {
      background: #fff;
      border-radius: 18px;
      border-bottom-left-radius: 5px;
      padding: 14px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      display: flex;
      gap: 5px;
      align-items: center;
      align-self: flex-start;
    }

    .typing-bubble span {
      width: 7px;
      height: 7px;
      background: #c7c7cc;
      border-radius: 50%;
      animation: bounce 1.3s infinite;
    }

    .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    footer {
      background: #fff;
      border-top: 1px solid #e5e5ea;
      padding: 12px 20px 16px;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      max-width: 760px;
      margin: 0 auto;
      align-items: flex-end;
    }

    #prompt {
      flex: 1;
      padding: 11px 16px;
      border: 1px solid #d1d1d6;
      border-radius: 22px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.45;
      transition: border-color 0.15s;
      background: #fafafa;
      overflow-y: auto;
    }

    #prompt:focus {
      border-color: #6366f1;
      background: #fff;
    }

    #send-btn {
      width: 44px;
      height: 44px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    #send-btn:hover:not(:disabled) { background: #4f46e5; }
    #send-btn:active:not(:disabled) { transform: scale(0.94); }
    #send-btn:disabled { background: #c7c7cc; cursor: default; }

    .disclaimer {
      text-align: center;
      font-size: 11px;
      color: #aeaeb2;
      margin-top: 7px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">A</div>
  <div>
    <div class="brand-name">Aria</div>
    <div class="brand-sub">NexusAI Labs &middot; Beta</div>
  </div>
  <div class="status">
    <div class="status-dot"></div>
    Online
  </div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">A</div>
    <h2>Hello, I'm Aria</h2>
    <p>Your AI assistant from NexusAI Labs.<br>Ask me anything — I'm here to help.</p>
    <div class="suggestions">
      <div class="suggestion" onclick="useSuggestion(this)">Write an email</div>
      <div class="suggestion" onclick="useSuggestion(this)">Explain a concept</div>
      <div class="suggestion" onclick="useSuggestion(this)">Help with code</div>
      <div class="suggestion" onclick="useSuggestion(this)">Summarise text</div>
      <div class="suggestion" onclick="useSuggestion(this)">Brainstorm ideas</div>
    </div>
  </div>
</div>

<footer>
  <form class="input-row" id="chat-form">
    <textarea id="prompt" placeholder="Message Aria…" rows="1"></textarea>
    <button type="submit" id="send-btn" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 2L8 14M8 2L3 7M8 2L13 7" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>
  <p class="disclaimer">Aria may produce inaccurate information. NexusAI Labs Beta &mdash; not for production use.</p>
</footer>

<script>
  const chatEl   = document.getElementById('chat');
  const promptEl = document.getElementById('prompt');
  const formEl   = document.getElementById('chat-form');
  const sendBtn  = document.getElementById('send-btn');

  function clearWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function addMessage(text, role) {
    clearWelcome();
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function addTyping() {
    clearWelcome();
    const el = document.createElement('div');
    el.id = 'typing';
    el.className = 'typing-bubble';
    el.innerHTML = '<span></span><span></span><span></span>';
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
    return el;
  }

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = promptEl.value.trim();
    if (!text || sendBtn.disabled) return;

    promptEl.value = '';
    autoResize();
    sendBtn.disabled = true;

    addMessage(text, 'user');
    const typing = addTyping();

    const minDelay = 900 + Math.random() * 1800;

    try {
      const [data] = await Promise.all([
        fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text }),
        }).then(r => r.json()),
        new Promise(r => setTimeout(r, minDelay)),
      ]);

      typing.remove();
      addMessage(data.response || "I'm having trouble responding right now. Please try again.", 'assistant');
    } catch {
      typing.remove();
      addMessage("I'm having trouble connecting. Please try again in a moment.", 'assistant');
    } finally {
      sendBtn.disabled = false;
      promptEl.focus();
    }
  });

  promptEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  function autoResize() {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + 'px';
  }

  promptEl.addEventListener('input', autoResize);

  function useSuggestion(el) {
    promptEl.value = el.textContent;
    autoResize();
    formEl.requestSubmit();
  }
</script>
</body>
</html>
